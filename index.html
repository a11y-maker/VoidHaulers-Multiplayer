<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAUL & RUN 3D: Fixed Lobby & Abandoned House</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background: #050608; color: #fff; overflow: hidden; height: 100vh; width: 100vw; }
        
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: rgba(0, 243, 255, 0.8); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 15; box-shadow: 0 0 8px #00f3ff; display: none; }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 10; display: none; }
        .interactive { pointer-events: auto; }

        #hud { display: flex; justify-content: space-between; width: 100%; }
        .hud-card { background: rgba(10, 12, 18, 0.85); border: 1px solid rgba(0, 243, 255, 0.4); padding: 12px 20px; border-radius: 8px; backdrop-filter: blur(8px); }
        .hud-title { font-size: 11px; color: #88a; text-transform: uppercase; }
        .hud-val { font-size: 24px; font-weight: bold; color: #00f3ff; }

        #loc-banner { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); border: 1px solid #00f3ff; color: #00f3ff; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: bold; letter-spacing: 2px; }

        /* On-Screen Mobile/Touch Controls */
        #dpad { position: absolute; bottom: 30px; right: 30px; display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 5px; z-index: 25; pointer-events: auto; }
        .dbtn { background: rgba(0,243,255,0.2); border: 1px solid #00f3ff; color: #fff; font-weight: bold; font-size: 18px; border-radius: 8px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .dbtn:active { background: rgba(0,243,255,0.6); }

        #click-prompt { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 45; cursor: pointer; }
        #click-prompt h2 { color: #00f3ff; font-size: 26px; margin-bottom: 10px; }

        #main-menu { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle, #101424 0%, #050608 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 50; }
        .menu-title { font-size: 48px; font-weight: 900; color: #00f3ff; letter-spacing: 4px; margin-bottom: 5px; }
        .menu-subtitle { font-size: 14px; color: #ff0055; letter-spacing: 6px; text-transform: uppercase; margin-bottom: 30px; }
        .menu-card { background: rgba(18, 22, 35, 0.9); border: 1px solid rgba(0, 243, 255, 0.3); padding: 25px; border-radius: 12px; width: 360px; text-align: center; }
        .mode-btn { background: linear-gradient(135deg, #00f3ff, #0066ff); border: none; color: #fff; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; text-transform: uppercase; }

        .overlay-screen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(10, 12, 20, 0.95); border: 2px solid #00f3ff; padding: 30px; border-radius: 12px; text-align: center; width: 400px; z-index: 40; display: none; }
        .btn { background: linear-gradient(135deg, #00f3ff, #0066ff); border: none; color: #fff; padding: 12px 18px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 14px; width: 100%; margin-top: 10px; text-transform: uppercase; }

        .math-problem { font-size: 26px; font-weight: bold; margin: 15px 0; color: #ffcc00; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 6px; }
        input[type="number"], input[type="text"] { width: 100%; padding: 12px; font-size: 16px; text-align: center; border-radius: 6px; border: 1px solid #00f3ff; background: #08090e; color: #fff; margin-bottom: 12px; outline: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>

    <div id="click-prompt" onclick="lockMouse()">
        <h2>KLIK DI SINI UNTUK KUNCI TETIKUS & GERAK</h2>
        <p style="color: #aaa;">Gunakan WASD atau Butang Anak Panah di skrin</p>
    </div>

    <div id="main-menu">
        <div class="menu-title">HAUL & RUN</div>
        <div class="menu-subtitle">ABANDONED HOUSE EXTRACTION</div>
        <div class="menu-card">
            <input type="text" id="player-name-input" placeholder="Nama Pemain..." value="Agent_01">
            <button class="mode-btn" onclick="startLobby()">MASUK KE LOBBY 3D</button>
        </div>
    </div>

    <div id="ui-layer">
        <div id="loc-banner">3D LOBBY: BERJALAN KE PAD TELEPORT</div>

        <div id="hud">
            <div class="hud-card">
                <div class="hud-title">HP</div>
                <div class="hud-val" id="hp-val" style="color: #ff0055;">100</div>
            </div>
            <div class="hud-card" style="text-align: center;">
                <div class="hud-title">ALATAN</div>
                <div class="hud-val" id="wheelbarrow-status" style="color: #ffcc00; font-size: 14px;">Tiada Wheelbarrow</div>
            </div>
            <div class="hud-card" style="text-align: right;">
                <div class="hud-title">BEG</div>
                <div class="hud-val" id="bag-val">0 / 3</div>
            </div>
        </div>

        <!-- On Screen D-Pad Touch Controls -->
        <div id="dpad">
            <div></div><div class="dbtn" onmousedown="keys.w=true" onmouseup="keys.w=false" ontouchstart="keys.w=true" ontouchend="keys.w=false">▲</div><div></div>
            <div class="dbtn" onmousedown="keys.a=true" onmouseup="keys.a=false" ontouchstart="keys.a=true" ontouchend="keys.a=false">◄</div>
            <div class="dbtn" onmousedown="keys.s=true" onmouseup="keys.s=false" ontouchstart="keys.s=true" ontouchend="keys.s=false">▼</div>
            <div class="dbtn" onmousedown="keys.d=true" onmouseup="keys.d=false" ontouchstart="keys.d=true" ontouchend="keys.d=false">►</div>
        </div>
    </div>

    <div class="overlay-screen interactive" id="math-modal">
        <h1 id="math-title" style="font-size: 20px; color: #00f3ff;">SOALAN MATEMATIK</h1>
        <div class="math-problem" id="math-question">12 + 15 = ?</div>
        <input type="number" id="math-answer" placeholder="Jawapan...">
        <button class="btn" onclick="submitMathAnswer()">HANTAR JAWAPAN</button>
    </div>

    <div class="overlay-screen interactive" id="shop-screen">
        <h1 style="color: #00f3ff;">FASA KEDAI</h1>
        <p style="font-size: 14px; color: #aaa; margin: 15px 0;">
            Hasil jualan: <b id="earned-cash" style="color:#00ff66;">+$0</b> | Tunai: <b id="total-cash" style="color:#00f3ff;">$0</b>
        </p>
        <button class="btn" style="background: linear-gradient(135deg, #00ff66, #009933); color:#000;" onclick="startNextRun()">PULANG KE LOBBY</button>
    </div>

    <script>
        let scene, camera, renderer;
        let isMathOpen = false, isShopOpen = false;

        let player = { name: "Agent_01", x: 0, z: 0, pitch: 0, yaw: 0, hp: 100, cash: 0, bagCount: 0, maxBag: 3, hasWheelbarrow: false, currentZone: 'LOBBY' };
        let keys = { w: false, a: false, s: false, d: false };
        let activeMathTask = null, colliders = [], lootObjects = [], doorObjects = [], teleporters = [], wheelbarrowMesh = null, extractionZone = null;

        const GRID_SIZE = 8, TILE_SIZE = 4;
        const abandonedHouseMap = [
            ['P', '.', '.', 'X', '.', '.', '.', '.'],
            ['.', 'X', '.', 'D', '.', 'X', 'L', '.'],
            ['.', 'X', '.', 'X', '.', 'X', '.', '.'],
            ['L', 'X', '.', '.', '.', 'D', '.', 'L'],
            ['.', 'D', 'X', 'X', '.', 'X', 'X', '.'],
            ['.', '.', '.', 'L', '.', '.', '.', '.'],
            ['X', 'X', '.', 'X', 'X', 'X', '.', 'D'],
            ['L', '.', '.', '.', '.', 'L', '.', 'S']
        ];

        function startLobby() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'flex';
            document.getElementById('crosshair').style.display = 'block';

            init3D();
            build3DLobby();
            lockMouse();
        }

        function lockMouse() {
            if (!isMathOpen && !isShopOpen) {
                document.body.requestPointerLock();
            }
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            document.addEventListener('pointerlockchange', () => {
                const prompt = document.getElementById('click-prompt');
                if (document.pointerLockElement === document.body) {
                    prompt.style.display = 'none';
                } else if (!isMathOpen && !isShopOpen) {
                    prompt.style.display = 'flex';
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement !== document.body || isMathOpen || isShopOpen) return;
                player.yaw -= e.movementX * 0.0025;
                player.pitch -= e.movementY * 0.0025;
                player.pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, player.pitch));
            });

            window.addEventListener('keydown', e => handleKey(e, true));
            window.addEventListener('keyup', e => handleKey(e, false));

            animate();
        }

        function handleKey(e, isDown) {
            const k = e.key.toLowerCase();
            if (k === 'w' || e.key === 'ArrowUp') keys.w = isDown;
            if (k === 's' || e.key === 'ArrowDown') keys.s = isDown;
            if (k === 'a' || e.key === 'ArrowLeft') keys.a = isDown;
            if (k === 'd' || e.key === 'ArrowRight') keys.d = isDown;
        }

        function build3DLobby() {
            clearScene();
            player.currentZone = 'LOBBY';
            player.x = 0; player.z = 0;
            document.getElementById('loc-banner').innerText = "3D LOBBY: BERJALAN KE PAD TELEPORT";

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0x121626 }));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const b = new THREE.Mesh(new THREE.BoxGeometry(30, 6, 30), new THREE.MeshStandardMaterial({ color: 0x00f3ff, wireframe: true }));
            b.position.y = 3;
            scene.add(b);
            colliders.push(new THREE.Box3().setFromObject(b));

            const pad1 = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 0.2, 16), new THREE.MeshBasicMaterial({ color: 0x00f3ff }));
            pad1.position.set(-5, 0.1, -5);
            scene.add(pad1);

            const pad2 = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 0.2, 16), new THREE.MeshBasicMaterial({ color: 0xff0055 }));
            pad2.position.set(5, 0.1, -5);
            scene.add(pad2);

            teleporters = [
                { x: -5, z: -5, mode: 'HOUSE' },
                { x: 5, z: -5, mode: 'HOUSE' }
            ];
        }

        function buildAbandonedHouseMap() {
            clearScene();
            player.currentZone = 'MAP';
            player.x = 2; player.z = 2;
            document.getElementById('loc-banner').innerText = "RUMAH TERBIAR (ABANDONED HOUSE)";
            document.getElementById('loc-banner').style.color = "#ff0055";

            const mapWidth = GRID_SIZE * TILE_SIZE;
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(mapWidth, mapWidth), new THREE.MeshStandardMaterial({ color: 0x221c16 }));
            floor.rotation.x = -Math.PI / 2;
            floor.position.set(mapWidth/2, 0, mapWidth/2);
            scene.add(floor);

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const type = abandonedHouseMap[r][c];
                    const posX = c * TILE_SIZE + TILE_SIZE/2;
                    const posZ = r * TILE_SIZE + TILE_SIZE/2;

                    if (type === 'X') {
                        const wall = new THREE.Mesh(new THREE.BoxGeometry(TILE_SIZE, 4.5, TILE_SIZE), new THREE.MeshStandardMaterial({ color: 0x1a1410 }));
                        wall.position.set(posX, 2.25, posZ);
                        scene.add(wall);
                        colliders.push(new THREE.Box3().setFromObject(wall));
                    } else if (type === 'D') {
                        const door = new THREE.Mesh(new THREE.BoxGeometry(TILE_SIZE, 4, 0.3), new THREE.MeshStandardMaterial({ color: 0x5c3a21 }));
                        door.position.set(posX, 2, posZ);
                        scene.add(door);
                        doorObjects.push({ mesh: door, x: posX, z: posZ, locked: true });
                    } else if (type === 'L') {
                        const box = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshStandardMaterial({ color: 0xff0055 }));
                        box.position.set(posX, 0.6, posZ);
                        scene.add(box);
                        lootObjects.push({ mesh: box, x: posX, z: posZ, collected: false });
                    } else if (type === 'S') {
                        const pad = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 0.1, 16), new THREE.MeshBasicMaterial({ color: 0x00ff66 }));
                        pad.position.set(posX, 0.05, posZ);
                        scene.add(pad);
                        extractionZone = { x: posX, z: posZ };
                    }
                }
            }
        }

        function clearScene() {
            colliders = []; lootObjects = []; doorObjects = []; teleporters = [];
            if (scene) {
                while(scene.children.length > 0){ scene.remove(scene.children[0]); }
                const ambient = new THREE.AmbientLight(0xffffff, 0.3);
                scene.add(ambient);
                const light = new THREE.PointLight(0x00f3ff, 1.2, 12);
                camera.add(light);
                scene.add(camera);
            }
        }

        function updateMovement() {
            if (isMathOpen || isShopOpen) return;

            let moveSpeed = 0.12;
            let dx = 0, dz = 0;

            if (keys.w) { dx -= Math.sin(player.yaw) * moveSpeed; dz -= Math.cos(player.yaw) * moveSpeed; }
            if (keys.s) { dx += Math.sin(player.yaw) * moveSpeed; dz += Math.cos(player.yaw) * moveSpeed; }
            if (keys.a) { dx -= Math.cos(player.yaw) * moveSpeed; dz += Math.sin(player.yaw) * moveSpeed; }
            if (keys.d) { dx += Math.cos(player.yaw) * moveSpeed; dz -= Math.sin(player.yaw) * moveSpeed; }

            let nextX = player.x + dx;
            let nextZ = player.z + dz;

            let pBox = new THREE.Box3(new THREE.Vector3(nextX - 0.4, 0.1, player.z - 0.4), new THREE.Vector3(nextX + 0.4, 1.8, player.z + 0.4));
            let collideX = false;
            for (let b of colliders) { if (pBox.intersectsBox(b)) { collideX = true; break; } }
            if (!collideX) player.x = nextX;

            pBox.set(new THREE.Vector3(player.x - 0.4, 0.1, nextZ - 0.4), new THREE.Vector3(player.x + 0.4, 1.8, nextZ + 0.4));
            let collideZ = false;
            for (let b of colliders) { if (pBox.intersectsBox(b)) { collideZ = true; break; } }
            if (!collideZ) player.z = nextZ;

            camera.position.set(player.x, 1.6, player.z);
            camera.rotation.set(0, 0, 0);
            camera.rotation.y = player.yaw;
            camera.rotation.x = player.pitch;

            if (player.currentZone === 'LOBBY') {
                teleporters.forEach(tp => {
                    if (Math.hypot(player.x - tp.x, player.z - tp.z) < 1.5) {
                        buildAbandonedHouseMap();
                    }
                });
            }

            if (player.currentZone === 'MAP') {
                doorObjects.forEach(door => {
                    if (door.locked && Math.hypot(player.x - door.x, player.z - door.z) < 1.8) {
                        triggerMathQuestion('DOOR', (correct) => {
                            if (correct) { door.locked = false; door.mesh.position.y = -10; }
                            else { player.hp -= 10; updateUI(); }
                        });
                    }
                });

                lootObjects.forEach(loot => {
                    if (!loot.collected && Math.hypot(player.x - loot.x, player.z - loot.z) < 1.5) {
                        triggerMathQuestion('LOOT', (correct) => {
                            if (correct) { loot.collected = true; loot.mesh.position.y = -10; player.bagCount++; updateUI(); }
                        });
                    }
                });

                if (extractionZone && Math.hypot(player.x - extractionZone.x, player.z - extractionZone.z) < 1.5) {
                    openShop();
                }
            }
        }

        function triggerMathQuestion(type, callback) {
            isMathOpen = true;
            document.exitPointerLock();
            const modal = document.getElementById('math-modal');
            const qEl = document.getElementById('math-question');
            const inputEl = document.getElementById('math-answer');

            inputEl.value = '';
            let n1 = Math.floor(Math.random() * 10) + 2, n2 = Math.floor(Math.random() * 10) + 2;
            let ans = type === 'DOOR' ? n1 + n2 : n1 * n2;
            qEl.innerText = type === 'DOOR' ? `${n1} + ${n2} = ?` : `${n1} × ${n2} kg = ?`;

            activeMathTask = { ans: ans, callback: callback };
            modal.style.display = 'block';
            setTimeout(() => inputEl.focus(), 100);
        }

        function submitMathAnswer() {
            const inputEl = document.getElementById('math-answer');
            const userAns = parseInt(inputEl.value);
            document.getElementById('math-modal').style.display = 'none';
            isMathOpen = false;

            if (activeMathTask) activeMathTask.callback(userAns === activeMathTask.ans);
            lockMouse();
        }

        function openShop() {
            isShopOpen = true;
            document.exitPointerLock();
            let earned = player.bagCount * 40;
            player.cash += earned;
            player.bagCount = 0;

            document.getElementById('earned-cash').innerText = `+$${earned}`;
            document.getElementById('total-cash').innerText = `$${player.cash}`;
            document.getElementById('shop-screen').style.display = 'block';
            updateUI();
        }

        function startNextRun() {
            document.getElementById('shop-screen').style.display = 'none';
            isShopOpen = false;
            build3DLobby();
            updateUI();
            lockMouse();
        }

        function updateUI() {
            document.getElementById('hp-val').innerText = player.hp;
            document.getElementById('bag-val').innerText = `${player.bagCount} / ${player.maxBag}`;
        }

        function animate() {
            requestAnimationFrame(animate);
            updateMovement();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
