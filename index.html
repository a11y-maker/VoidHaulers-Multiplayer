<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAUL & RUN 3D: Fixed Working Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
        body { background: #050608; color: #fff; overflow: hidden; height: 100vh; width: 100vw; }
        
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: #00f3ff; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 15; display: none; }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; z-index: 10; display: none; }
        .hud-card { background: rgba(10, 12, 18, 0.85); border: 1px solid #00f3ff; padding: 10px 15px; border-radius: 8px; }
        .hud-title { font-size: 10px; color: #88a; text-transform: uppercase; }
        .hud-val { font-size: 20px; font-weight: bold; color: #00f3ff; }

        #loc-banner { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: #000; border: 1px solid #00f3ff; color: #00f3ff; padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; }

        /* Kawalan On-Screen (Boleh Klik Guna Mouse / Skrin Sentuh) */
        #dpad { position: absolute; bottom: 20px; left: 20px; display: grid; grid-template-columns: repeat(3, 45px); grid-template-rows: repeat(3, 45px); gap: 5px; z-index: 25; pointer-events: auto; }
        .dbtn { background: rgba(0,243,255,0.3); border: 1px solid #00f3ff; color: #fff; font-weight: bold; font-size: 16px; border-radius: 6px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .dbtn:active { background: #00f3ff; color: #000; }

        /* Muka Depan / Main Menu */
        #main-menu { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #0a0c14; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 50; }
        .menu-title { font-size: 36px; font-weight: bold; color: #00f3ff; margin-bottom: 5px; }
        .menu-subtitle { font-size: 12px; color: #ff0055; margin-bottom: 25px; letter-spacing: 2px; }
        .menu-card { background: #121624; border: 1px solid #00f3ff; padding: 20px; border-radius: 10px; width: 320px; text-align: center; }
        .mode-btn { background: #00f3ff; border: none; color: #000; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; text-transform: uppercase; }

        /* Modals */
        .overlay-screen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #0d101a; border: 2px solid #00f3ff; padding: 25px; border-radius: 10px; text-align: center; width: 340px; z-index: 40; display: none; }
        .btn { background: #00f3ff; border: none; color: #000; padding: 10px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; }

        .math-problem { font-size: 24px; font-weight: bold; margin: 15px 0; color: #ffcc00; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 5px; }
        input[type="number"], input[type="text"] { width: 100%; padding: 10px; font-size: 16px; text-align: center; border-radius: 5px; border: 1px solid #00f3ff; background: #000; color: #fff; margin-bottom: 10px; outline: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>

    <div id="main-menu">
        <div class="menu-title">HAUL & RUN</div>
        <div class="menu-subtitle">ABANDONED HOUSE EXTRACTION</div>
        <div class="menu-card">
            <input type="text" id="player-name-input" placeholder="Nama..." value="Agent_01">
            <button class="mode-btn" onclick="startLobby()">MASUK KE LOBBY 3D</button>
        </div>
    </div>

    <div id="ui-layer">
        <div id="loc-banner">3D LOBBY: BERJALAN KE PAD TELEPORT</div>

        <div style="display: flex; justify-content: space-between; width: 100%;">
            <div class="hud-card">
                <div class="hud-title">HP</div>
                <div class="hud-val" id="hp-val" style="color: #ff0055;">100</div>
            </div>
            <div class="hud-card" style="text-align: right;">
                <div class="hud-title">BEG</div>
                <div class="hud-val" id="bag-val">0 / 3</div>
            </div>
        </div>

        <!-- Butang Kawalan Manuel (Boleh tekan guna Mouse/Skrin jika Keyboard terkunci) -->
        <div id="dpad">
            <div></div><div class="dbtn" onmousedown="keys.w=true" onmouseup="keys.w=false" ontouchstart="keys.w=true" ontouchend="keys.w=false">▲</div><div></div>
            <div class="dbtn" onmousedown="keys.a=true" onmouseup="keys.a=false" ontouchstart="keys.a=true" ontouchend="keys.a=false">◄</div>
            <div class="dbtn" onmousedown="keys.s=true" onmouseup="keys.s=false" ontouchstart="keys.s=true" ontouchend="keys.s=false">▼</div>
            <div class="dbtn" onmousedown="keys.d=true" onmouseup="keys.d=false" ontouchstart="keys.d=true" ontouchend="keys.d=false">►</div>
        </div>
    </div>

    <div class="overlay-screen" id="math-modal">
        <h3 style="color: #00f3ff;">PENGESAHAN MATEMATIK</h3>
        <div class="math-problem" id="math-question">12 + 15 = ?</div>
        <input type="number" id="math-answer" placeholder="Jawapan...">
        <button class="btn" onclick="submitMathAnswer()">HANTAR JAWAPAN</button>
    </div>

    <div class="overlay-screen" id="shop-screen">
        <h3 style="color: #00f3ff;">FASA KEDAI</h3>
        <p style="font-size: 13px; color: #aaa; margin: 15px 0;">
            Hasil Jualan: <b id="earned-cash" style="color:#00ff66;">+$0</b> | Tunai: <b id="total-cash" style="color:#00f3ff;">$0</b>
        </p>
        <button class="btn" style="background: #00ff66;" onclick="startNextRun()">PULANG KE LOBBY</button>
    </div>

    <script>
        let scene, camera, renderer;
        let isMathOpen = false, isShopOpen = false;

        let player = { x: 0, z: 0, pitch: 0, yaw: 0, hp: 100, cash: 0, bagCount: 0, maxBag: 3, currentZone: 'LOBBY' };
        let keys = { w: false, a: false, s: false, d: false };
        let activeMathTask = null, colliders = [], lootObjects = [], doorObjects = [], teleporters = [], extractionZone = null;

        const GRID_SIZE = 8, TILE_SIZE = 4;
        const abandonedHouseMap = [
            ['P', '.', '.', 'X', '.', '.', '.', '.'],
            ['.', 'X', '.', 'D', '.', 'X', 'L', '.'],
            ['.', 'X', '.', 'X', '.', 'X', '.', '.'],
            ['L', 'X', '.', '.', '.', 'D', '.', 'L'],
            ['.', 'D', 'X', 'X', '.', 'X', 'X', '.'],
            ['.', '.', '.', 'L', '.', '.', '.', '.'],
            ['X', 'X', '.', 'X', 'X', 'X', '.', 'D'],
            ['L', '.', '.', '.', '.', 'L', '.', 'S']
        ];

        function startLobby() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'flex';
            document.getElementById('crosshair').style.display = 'block';

            init3D();
            build3DLobby();
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // Kawalan Tetikus FPS
            document.addEventListener('click', (e) => {
                if (!isMathOpen && !isShopOpen && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
                    document.body.requestPointerLock();
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body && !isMathOpen && !isShopOpen) {
                    player.yaw -= e.movementX * 0.003;
                    player.pitch -= e.movementY * 0.003;
                    player.pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, player.pitch));
                }
            });

            // Pengesan Papan Kekunci Terus (W, A, S, D & Anak Panah)
            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'ArrowUp') keys.w = true;
                if (k === 's' || e.key === 'ArrowDown') keys.s = true;
                if (k === 'a' || e.key === 'ArrowLeft') keys.a = true;
                if (k === 'd' || e.key === 'ArrowRight') keys.d = true;
            });

            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'ArrowUp') keys.w = false;
                if (k === 's' || e.key === 'ArrowDown') keys.s = false;
                if (k === 'a' || e.key === 'ArrowLeft') keys.a = false;
                if (k === 'd' || e.key === 'ArrowRight') keys.d = false;
            });

            animate();
        }

        function build3DLobby() {
            clearScene();
            player.currentZone = 'LOBBY';
            player.x = 0; player.z = 0;
            document.getElementById('loc-banner').innerText = "3D LOBBY: BERJALAN KE PAD TELEPORT";

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0x121626 }));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const pad1 = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 0.2, 16), new THREE.MeshBasicMaterial({ color: 0x00f3ff }));
            pad1.position.set(-5, 0.1, -5);
            scene.add(pad1);

            const pad2 = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 0.2, 16), new THREE.MeshBasicMaterial({ color: 0xff0055 }));
            pad2.position.set(5, 0.1, -5);
            scene.add(pad2);

            teleporters = [{ x: -5, z: -5 }, { x: 5, z: -5 }];
        }

        function buildAbandonedHouseMap() {
            clearScene();
            player.currentZone = 'MAP';
            player.x = 2; player.z = 2;
            document.getElementById('loc-banner').innerText = "RUMAH TERBIAR (ABANDONED HOUSE)";

            const mapWidth = GRID_SIZE * TILE_SIZE;
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(mapWidth, mapWidth), new THREE.MeshStandardMaterial({ color: 0x221c16 }));
            floor.rotation.x = -Math.PI / 2;
            floor.position.set(mapWidth/2, 0, mapWidth/2);
            scene.add(floor);

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const type = abandonedHouseMap[r][c];
                    const posX = c * TILE_SIZE + TILE_SIZE/2;
                    const posZ = r * TILE_SIZE + TILE_SIZE/2;

                    if (type === 'X') {
                        const wall = new THREE.Mesh(new THREE.BoxGeometry(TILE_SIZE, 4, TILE_SIZE), new THREE.MeshStandardMaterial({ color: 0x1a1410 }));
                        wall.position.set(posX, 2, posZ);
                        scene.add(wall);
                        colliders.push({ x: posX, z: posZ });
                    } else if (type === 'D') {
                        const door = new THREE.Mesh(new THREE.BoxGeometry(TILE_SIZE, 4, 0.3), new THREE.MeshStandardMaterial({ color: 0x5c3a21 }));
                        door.position.set(posX, 2, posZ);
                        scene.add(door);
                        doorObjects.push({ mesh: door, x: posX, z: posZ, locked: true });
                    } else if (type === 'L') {
                        const box = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshStandardMaterial({ color: 0xff0055 }));
                        box.position.set(posX, 0.6, posZ);
                        scene.add(box);
                        lootObjects.push({ mesh: box, x: posX, z: posZ, collected: false });
                    } else if (type === 'S') {
                        const pad = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 0.1, 16), new THREE.MeshBasicMaterial({ color: 0x00ff66 }));
                        pad.position.set(posX, 0.05, posZ);
                        scene.add(pad);
                        extractionZone = { x: posX, z: posZ };
                    }
                }
            }
        }

        function clearScene() {
            colliders = []; lootObjects = []; doorObjects = []; teleporters = [];
            if (scene) {
                while(scene.children.length > 0){ scene.remove(scene.children[0]); }
                const ambient = new THREE.AmbientLight(0xffffff, 0.4);
                scene.add(ambient);
                const light = new THREE.PointLight(0x00f3ff, 1.5, 15);
                camera.add(light);
                scene.add(camera);
            }
        }

        function updateMovement() {
            if (isMathOpen || isShopOpen) return;

            let moveSpeed = 0.14;
            let dx = 0, dz = 0;

            if (keys.w) { dx -= Math.sin(player.yaw) * moveSpeed; dz -= Math.cos(player.yaw) * moveSpeed; }
            if (keys.s) { dx += Math.sin(player.yaw) * moveSpeed; dz += Math.cos(player.yaw) * moveSpeed; }
            if (keys.a) { dx -= Math.cos(player.yaw) * moveSpeed; dz += Math.sin(player.yaw) * moveSpeed; }
            if (keys.d) { dx += Math.cos(player.yaw) * moveSpeed; dz -= Math.sin(player.yaw) * moveSpeed; }

            // Pergerakan Pantas Tanpa Lag
            let nextX = player.x + dx;
            let nextZ = player.z + dz;

            let canMove = true;
            for (let c of colliders) {
                if (Math.hypot(nextX - c.x, nextZ - c.z) < 2.0) {
                    canMove = false;
                    break;
                }
            }

            if (canMove) {
                player.x = nextX;
                player.z = nextZ;
            }

            camera.position.set(player.x, 1.6, player.z);
            camera.rotation.set(0, 0, 0);
            camera.rotation.y = player.yaw;
            camera.rotation.x = player.pitch;

            // Semak Teleport di Lobby
            if (player.currentZone === 'LOBBY') {
                teleporters.forEach(tp => {
                    if (Math.hypot(player.x - tp.x, player.z - tp.z) < 1.5) {
                        buildAbandonedHouseMap();
                    }
                });
            }

            // Semak Interaksi dalam Rumah Terbiar
            if (player.currentZone === 'MAP') {
                doorObjects.forEach(door => {
                    if (door.locked && Math.hypot(player.x - door.x, player.z - door.z) < 1.8) {
                        triggerMathQuestion('DOOR', (correct) => {
                            if (correct) { door.locked = false; door.mesh.position.y = -10; }
                            else { player.hp -= 10; updateUI(); }
                        });
                    }
                });

                lootObjects.forEach(loot => {
                    if (!loot.collected && Math.hypot(player.x - loot.x, player.z - loot.z) < 1.5) {
                        triggerMathQuestion('LOOT', (correct) => {
                            if (correct) { loot.collected = true; loot.mesh.position.y = -10; player.bagCount++; updateUI(); }
                        });
                    }
                });

                if (extractionZone && Math.hypot(player.x - extractionZone.x, player.z - extractionZone.z) < 1.5) {
                    openShop();
                }
            }
        }

        function triggerMathQuestion(type, callback) {
            isMathOpen = true;
            document.exitPointerLock();
            const modal = document.getElementById('math-modal');
            const qEl = document.getElementById('math-question');
            const inputEl = document.getElementById('math-answer');

            inputEl.value = '';
            let n1 = Math.floor(Math.random() * 10) + 2, n2 = Math.floor(Math.random() * 10) + 2;
            let ans = type === 'DOOR' ? n1 + n2 : n1 * n2;
            qEl.innerText = type === 'DOOR' ? `${n1} + ${n2} = ?` : `${n1} × ${n2} kg = ?`;

            activeMathTask = { ans: ans, callback: callback };
            modal.style.display = 'block';
            setTimeout(() => inputEl.focus(), 100);
        }

        function submitMathAnswer() {
            const inputEl = document.getElementById('math-answer');
            const userAns = parseInt(inputEl.value);
            document.getElementById('math-modal').style.display = 'none';
            isMathOpen = false;

            if (activeMathTask) activeMathTask.callback(userAns === activeMathTask.ans);
        }

        function openShop() {
            isShopOpen = true;
            document.exitPointerLock();
            let earned = player.bagCount * 40;
            player.cash += earned;
            player.bagCount = 0;

            document.getElementById('earned-cash').innerText = `+$${earned}`;
            document.getElementById('total-cash').innerText = `$${player.cash}`;
            document.getElementById('shop-screen').style.display = 'block';
            updateUI();
        }

        function startNextRun() {
            document.getElementById('shop-screen').style.display = 'none';
            isShopOpen = false;
            build3DLobby();
            updateUI();
        }

        function updateUI() {
            document.getElementById('hp-val').innerText = player.hp;
            document.getElementById('bag-val').innerText = `${player.bagCount} / ${player.maxBag}`;
        }

        function animate() {
            requestAnimationFrame(animate);
            updateMovement();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
